name: Game Coupon Notifier

on:
  schedule:
    - cron: '7 */2 * * *'  # 2시간마다 새 코드 자동 수집 (UTC 기준, 매 짝수 시 7분)
  workflow_dispatch:
    inputs:
      genshin:
        description: '원신 코드 (공백/쉼표 구분, 모두 비우면 자동 수집)'
        required: false
      hsr:
        description: '붕괴 스타레일 코드 (공백/쉼표 구분)'
        required: false
      zzz:
        description: '젠레스 존 제로 코드 (공백/쉼표 구분)'
        required: false
      wuwa:
        description: '명조 코드 (공백/쉼표 구분, 링크 없이 코드만 전송)'
        required: false

permissions:
  contents: read
  actions: write  # 워크플로 자동 재활성화용

concurrency:
  group: coupon
  cancel-in-progress: false

jobs:
  coupon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 보낸 코드 기록 불러오기
        id: sent
        uses: actions/cache/restore@v6
        with:
          path: sent.json
          key: sent-${{ github.run_id }}
          restore-keys: sent-
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python coupon.py
        env:
          GENSHIN: ${{ inputs.genshin }}
          HSR: ${{ inputs.hsr }}
          ZZZ: ${{ inputs.zzz }}
          WUWA: ${{ inputs.wuwa }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: 보낸 코드 기록 저장
        # 기록은 repo가 아닌 Actions 캐시에 보관 (Fork·복사해도 따라가지 않음). 내용이 바뀐 경우만 저장
        if: hashFiles('sent.json') != '' && steps.sent.outputs.cache-matched-key != format('sent-{0}', hashFiles('sent.json'))
        uses: actions/cache/save@v6
        with:
          path: sent.json
          key: sent-${{ hashFiles('sent.json') }}
      - name: 자동 실행 유지
        # Public repo는 60일간 활동이 없으면 스케줄이 꺼지므로, 실행할 때마다 워크플로를 다시 활성화해 타이머를 초기화
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/coupon.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
